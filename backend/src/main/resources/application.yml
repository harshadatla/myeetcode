spring:
  application:
    name: mycodequest-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:mycodequest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console

judge0:
  url: ${JUDGE0_URL:http://localhost:2358}

jwt:
  secret: ${JWT_SECRET:mycodequest-default-secret-key-change-in-production-at-least-256-bits-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}